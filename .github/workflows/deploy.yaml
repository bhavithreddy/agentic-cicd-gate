name: Agentic CI/CD Deployment Gate

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/agentic-cicd-gate:${{ steps.vars.outputs.image_tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/agentic-cicd-gate:${{ steps.vars.outputs.image_tag }}

  k8s-health-gate:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Query cluster health via Elastic MCP
        id: health
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.ELASTIC_MCP_ENDPOINT }}" \
            -H "Authorization: ApiKey ${{ secrets.ELASTIC_MCP_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": { "name": "k8s_node_health_check", "arguments": {} }
            }')

          echo "Raw MCP response: $RESPONSE"

          INNER_JSON=$(echo "$RESPONSE" | jq -r '.result.content[0].text')
          MEMORY_PCT=$(echo "$INNER_JSON" | jq -r '.results[] | select(.type=="esql_results") | .data.values[0][2]')
          CPU_CORES=$(echo "$INNER_JSON" | jq -r '.results[] | select(.type=="esql_results") | .data.values[0][1]')
          NODE_NAME=$(echo "$INNER_JSON" | jq -r '.results[] | select(.type=="esql_results") | .data.values[0][0]')

          echo "Node: $NODE_NAME | CPU cores: $CPU_CORES | Memory %: $MEMORY_PCT"

          THRESHOLD=80
          if (( $(echo "$MEMORY_PCT > $THRESHOLD" | bc -l) )); then
            echo "::error::Cluster memory usage ($MEMORY_PCT%) exceeds threshold ($THRESHOLD%) on node $NODE_NAME — blocking deployment"
            exit 1
          else
            echo "Cluster healthy — memory usage $MEMORY_PCT% is within threshold ($THRESHOLD%). Safe to deploy."
          fi

  deploy:
    needs: [build-and-push, k8s-health-gate]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*agentic-cicd-gate:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-cicd-gate:${{ needs.build-and-push.outputs.image_tag }}|" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy image ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
          git push